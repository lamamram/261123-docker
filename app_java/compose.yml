## docker compose avec build
## si l'image existe en local => il la prend
## OU forcer le build avec docker compose up -d --build 
## sinon on build à partir de la section build

networks:
  app-java:
    name: app-java
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

services:
  httpd:
    container_name: app-java-httpd
    # image: app-java-httpd:0.1
    image: localhost/app-java-httpd:0.1
    build:
      context: ./httpd
      # dockerfile: Dockerfile
      # no cache: recalcule les couches à partir du Dockerfile
      # no_cache: true
    restart: unless-stopped
    networks:
      - app-java
    ports:
      - 8081:80
    depends_on: # configuration avec healthcheck
      tomcat:
        condition: service_healthy
  
  tomcat:
    container_name: app-java-tomcat
    restart: unless-stopped
    image: app-java-tomcat:0.1
    build:
      context: ./tomcat
      # dockerfile: Dockerfile
      args:
        # - TOMCAT_VERSION_MAJOR=9
        - TOMCAT_VERSION_FULL=9.0.124
    networks:
      - app-java
    ## on peut également écrire le healthchecl ICI
    # healthcheck:
    #   test: grep "Server startup" /opt/tomcat/logs/catalina.*.log
    #   interval: 3s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 3s