## COMMANDES D'USAGE
# lancer/arrêter la stack: docker compose --profile run up -d | docker compose --profile run down
# avec un service one-shot: docker compose run --rm backup
# avec un volumes_from: docker compose --profile volumes-from up -d; docker compose down

networks:
  app-php:
    name: app-php # fixe le nom du réseau
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

volumes:
  data:
    name: data # fixe le nom du volume nommé

## service = définition type de conteneurs qui seront potentiellement répliqués dans l'infra
services:
  db:
    container_name: app-php-mariadb # fixe le nom statique du service
    image: mariadb:10.11.19-jammy
    restart: unless-stopped
    networks:
      - app-php
    env_file:
      - .env
    volumes:
      - ./mariadb-init.sql:/docker-entrypoint-initdb.d/mariadb-init.sql:ro
      - data:/var/lib/mysql
    profiles:
      - run
      - volumes-from
  
  fpm:
    container_name: app-php-fpm
    image: php:8.6.0-fpm-trixie
    restart: unless-stopped
    networks:
      - app-php
    volumes:
      - ./index.php:/srv/index.php:ro
      - ./docker-php-entrypoint.sh:/usr/local/bin/docker-php-entrypoint.sh:ro
    # redéfinir l'entrypoint du conteneur PHP-FPM pour le customiser
    # ne pas oublier de rendre le script exécutable avec chmod +x docker-php-entrypoint.sh
    # ne pas oublier de réexpliciter la command: ["php-fpm"]
    entrypoint: ["docker-php-entrypoint.sh"]
    command: ["php-fpm"]
    depends_on:
      - db # on crée le service fpm quand le service db est prêt
    profiles:
      - run

    # TENTATIVE D'UTILISATION DES HOOKS: mais on ne peut pas redémarrer le conteneur de façon détaché ici !
    # post_start: pre_start, pre_stop et post_stop sont des hooks disponibles pour le conteneur
    #   - command: docker-php-ext-install pdo_mysql


  ## docker compose exec fpm docker-php-ext-install pdo_mysql
  ## docker compose restart fpm

  web:
    container_name: app-php-nginx
    image: nginx:trixie-perl
    restart: unless-stopped
    networks:
      - app-php
    volumes:
      - ./vhost.conf:/etc/nginx/conf.d/vhost.conf:ro
    ports:
      - 8080:80
    depends_on:
      - fpm
    profiles:
      - run
  
############### tâches d'administration #############################

## version à froid: on utilise le volume data même si le service db est down

  backup:
    image: alpine:3.24.4
    volumes:
      - data:/data:ro # /data dans le conteneur alpine est créé à la volée !!!
      - ./dump:/dump # tout est créé à la volée
    command: tar -cvzf /dump/backup.tar.gz /data
    profiles:
      - task


## version à chaud: avec la clé volumes_from

  backup-hot:
    image: alpine:3.24.4
    volumes_from:
      # permet d'injecter tous les volumes liés au service db dans le conteneur courant
      - db # ICI DB DOIT ETRE UP !!!        
    volumes:
      - ./dump:/dump
    # ----------------------------------------> emplacement du volume data lié au service db
    command: tar -cvzf /dump/backup-hot.tar.gz /var/lib/mysql
    profiles:
      - volumes-from
    depends_on:
      - db

  ## le volumes_from permet d'utilser les volumes nommés "anonymes"
  ## définis dans le Dockerfile de l'image avec l'instruction VOLUMES
